<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf IQ Legal</title>
  <style>
    :root {
      color-scheme: light;
      --pine: #073f29;
      --gold: #b88a35;
      --ink: #171915;
      --muted: #6f7369;
      --ivory: #f5f0df;
      --card: #fffdf7;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--ivory);
      color: var(--ink);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(184, 138, 53, 0.28);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 24px 80px rgba(7, 63, 41, 0.12);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 12px;
      color: var(--pine);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    nav {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: block;
      padding: 18px 20px;
      border-radius: 999px;
      background: var(--pine);
      color: white;
      text-decoration: none;
      font-weight: 750;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">Golf IQ</div>
      <h1>Legal</h1>
      <p>Public legal documents for Golf IQ, the private golf intelligence app.</p>
      <nav>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </nav>
    </section>
  </main>
</body>
</html>
